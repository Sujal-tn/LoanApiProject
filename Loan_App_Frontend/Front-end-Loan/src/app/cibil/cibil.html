<div class="container mt-5">
  <div class="main-card">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>
        <i class="fa-solid fa-chart-line text-primary"></i>
        CIBIL Score
      </h3>

      <div class="top-actions">
        <button class="btn btn-primary" (click)="checkScore()">Check Score</button>
        <!-- <button class="btn btn-outline-secondary" (click)="viewLastScore()">Last Score</button> -->
      </div>
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage()">
      {{errorMessage()}}
    </div>

    <div class="row mb-5">
      <div class="col-md-6 mb-3">
        <div class="info-box">
          <label>Name</label>
          <h5>{{report()?.customerName || '-'}}</h5>
        </div>
      </div>

      <div class="col-md-6 mb-3">
        <div class="info-box">
          <label>PAN Number</label>
          <h5>{{report()?.panNo || '-'}}</h5>
        </div>
      </div>
    </div>

    <div class="text-center" *ngIf="report() as r">

      <div class="meter">
        <div class="meter-body"></div>
        <div class="meter-inner"></div>

        <div class="needle"
             [style.background]="getColor()"
             [style.transform]="'rotate(' + getRotation() + 'deg)'">
        </div>

        <div class="needle-dot"></div>
      </div>

      <div class="range">
        <span>500</span>
        <span>700</span>
        <span>900</span>
      </div>

      <div class="score-text">
        <h1 [style.color]="getColor()">{{r.cibilScore}}</h1>
      </div>

      <div class="mt-3">
        <small class="text-muted">Last Checked Date</small>
        <h6><strong>{{r.checkDate | date:'dd MMM yyyy'}}</strong></h6>
        <small class="text-muted">{{r.checkDate | date:'hh:mm a'}}</small>
      </div>

    </div>

  </div>
</div>
