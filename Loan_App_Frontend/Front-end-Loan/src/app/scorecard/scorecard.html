<div class="container mt-4">

  <div class="alert alert-danger" *ngIf="errorMessage()">
    <strong>Score Card Not Generated</strong><br />
    {{errorMessage()}}
    <div class="mt-2">
      <a routerLink="/cibil">Go to CIBIL Score page</a>
    </div>
  </div>

  <div class="card shadow-lg border-0 rounded-4" *ngIf="scoreCard() as s">

    <div class="card-header bg-primary text-white p-4">
      <h2 class="mb-0">Loan Score Card</h2>
    </div>

    <div class="card-body p-4">
      <table class="table table-bordered">
        <tr>
          <th>Customer Id</th>
          <td>{{s.customerId}}</td>
        </tr>

        <tr>
          <th>Risk Category</th>
          <td>{{s.riskCategory}}</td>
        </tr>

        <tr>
          <th>Eligible Loan Amount</th>
          <td>
            <span class="text-danger fw-bold" *ngIf="s.eligibleLoanAmount==0">
              Not Eligible For Loan
            </span>
            <span class="text-success fw-bold" *ngIf="s.eligibleLoanAmount!=0">
              ₹ {{s.eligibleLoanAmount}}
            </span>
          </td>
        </tr>
      </table>
    </div>

  </div>
<br>
  <a routerLink="/customers" class="btn btn-info">Back to Customer List</a>

</div>
