
<div class="loan-container">
  <h2>Apply for a Loan</h2>

  <form #loanForm="ngForm" (ngSubmit)="submitApplication()">

    <div class="form-group">
      <label for="loanType">Loan Type</label>
      <select
        id="loanType"
        name="loanType"
        [(ngModel)]="loan.loanType"
        required>
        <option value="">Select Loan Type</option>
        <option *ngFor="let type of loanTypes" [value]="type">
          {{ type }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="loanAmount">Loan Amount</label>
      <input
        id="loanAmount"
        name="loanAmount"
        type="number"
        [(ngModel)]="loan.loanAmount"
        min="1"
        required
        placeholder="Enter loan amount" />
    </div>

    <div class="form-group">
      <label for="tenureMonths">Loan Tenure</label>
      <select
        id="tenureMonths"
        name="tenureMonths"
        [(ngModel)]="loan.tenureMonths"
        (ngModelChange)="updateInterestRate()"
        required>
        <option *ngFor="let tenure of tenures"
                [ngValue]="tenure.months">
          {{ tenure.years }} years ({{ tenure.months }} months)
          - {{ tenure.interestRate }}%
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="interestRate">Interest Rate (%)</label>
      <input
        id="interestRate"
        name="interestRate"
        type="number"
        [ngModel]="loan.interestRate"
        readonly />
    </div>

    <div class="form-group">
      <label for="emiAmount">EMI Amount</label>
      <input
        id="emiAmount"
        name="emiAmount"
        type="number"
        [ngModel]="loan.emiAmount"
        readonly />
    </div>

    <div class="form-group">
      <label for="bankName">Bank Name</label>
      <input
        id="bankName"
        name="bankName"
        [(ngModel)]="loan.bankName"
        required
        placeholder="Enter bank name" />
    </div>

    <div class="form-group">
      <label for="bankAccountNumber">Bank Account Number</label>
      <input
        id="bankAccountNumber"
        name="bankAccountNumber"
        [(ngModel)]="loan.bankAccountNumber"
        required
        maxlength="18"
        placeholder="Enter account number" />
    </div>

    <div class="form-group">
      <label for="ifscCode">IFSC Code</label>
      <input
        id="ifscCode"
        name="ifscCode"
        [(ngModel)]="loan.ifscCode"
        required
        maxlength="11"
        placeholder="Enter IFSC code" />
    </div>

    <!-- Customer ID is fetched from the authenticated JWT.
         It must not be entered by the customer. -->

    <div class="form-group">
      <label for="emiDay">EMI Payment Date</label>
      <select
        id="emiDay"
        name="emiDay"
        [(ngModel)]="loan.emiDay"
        required>
        <option *ngFor="let day of emiDates" [ngValue]="day">
          {{ day }}
        </option>
      </select>
    </div>

    <div class="buttons">
      <button type="button"
              class="btn-secondary"
              (click)="calculateEmi()"
              [disabled]="loading">
        Calculate EMI
      </button>

      <button type="submit"
              class="btn-primary"
              [disabled]="loading || !loanForm.valid">
        {{ loading ? 'Please wait...' : 'Submit Application' }}
      </button>
    </div>

    <p class="success" *ngIf="message">{{ message }}</p>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  </form>
</div>
